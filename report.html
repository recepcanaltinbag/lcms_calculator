<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
</head>
<body>
<main id="root"><p class="muted">Loading…</p></main>
<script type="module">
import { shell, loadRegistry, demoBanner, showError } from './js/ui/shell.js';
import { renderExperiment } from './js/ui/report.js';
shell('experiments.html');
const root = document.getElementById('root');
try {
  const reg = await loadRegistry();
  if (!reg) throw new Error('No experiment registry found (local/ or demo/).');
  const id = new URLSearchParams(location.search).get('exp') || reg.registry.experiments[0].id;
  const exp = reg.registry.experiments.find(e => e.id === id);
  if (!exp) throw new Error(`Unknown experiment "${id}".`);
  document.title = exp.title;
  root.innerHTML = '';
  if (reg.kind === 'demo') root.insertAdjacentHTML('beforeend', demoBanner(reg.kind));
  const holder = document.createElement('div');
  root.appendChild(holder);
  await renderExperiment(holder, { registry: reg.registry, expId: id, readText: reg.readText, source: reg.kind });
} catch (e) { showError(root, e); }
</script>
</body>
</html>
