<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Experiments</title>
</head>
<body>
<main id="root"><p class="muted">Loading…</p></main>
<script type="module">
import { shell, loadRegistry, demoBanner, showError } from './js/ui/shell.js';
import { esc } from './js/ui/report.js';
shell('experiments.html');
const root = document.getElementById('root');
try {
  const reg = await loadRegistry();
  if (!reg) throw new Error('No registry found.');
  const { experiments, calibrations } = reg.registry;
  const calLabel = id => calibrations.find(c => c.id === id)?.label || id;
  root.innerHTML = demoBanner(reg.kind) + `<h1>Experiments</h1>
    <p class="lede">${experiments.length} experiments in <span class="mono">${reg.kind}/experiments.json</span>. Each report recalculates from the raw instrument export every time it opens, so editing the registry or the parameters on the page updates every number and figure.</p>
    <div class="grid cols-2">${experiments.map(e => `
      <a class="card link" href="report.html?exp=${encodeURIComponent(e.id)}">
        <div class="muted small">${e.design === 'timecourse' ? 'Time course' : 'End-point'} · <span class="mono">${esc(e.file.split('/').pop())}</span></div>
        <h3 style="margin-top:4px">${esc(e.title)}</h3>
        <div class="small">${e.mode === 'relative' ? '<span class="badge warn">relative (% of t₀)</span>' : (e.calibrations || []).map(c => `<span class="badge">${esc(calLabel(c))}</span>`).join(' ')}
        ${(e.assumed || []).length ? '<span class="badge warn">parameters to confirm</span>' : ''}</div>
      </a>`).join('')}</div>`;
} catch (e) { showError(root, e); }
</script>
</body>
</html>
